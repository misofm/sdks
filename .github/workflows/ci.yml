name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      # The root package.json is private — check the tarball contents inside
      # each publishable workspace package instead of at the repo root, where
      # `npm pack` would otherwise pass vacuously against the private package.
      - name: Pack
        run: |
          for dir in packages/*/; do
            echo "::group::npm pack --dry-run ($dir)"
            (cd "$dir" && npm pack --dry-run)
            echo "::endgroup::"
          done

  # Packs every workspace package into a real tarball and installs them into
  # an isolated fixture consumer, then typechecks and runs it. Inside the
  # workspace every import resolves locally regardless of a package's
  # `exports` map, so `bun test` and `npm pack --dry-run` above cannot catch
  # a broken or missing published entry point — only a real tarball install
  # fails the way a downstream consumer would.
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # The Bridge workerd smoke uses Wrangler 4.137.0, which requires Node 22.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Consumer check
        run: bun run test:consumer
      - name: Bridge packed Node and Worker consumers
        run: bun run --filter @misofm/bridge test:consumer
      - name: Bridge local workerd runtime
        run: bun run --filter @misofm/bridge test:workerd
