name: Publish to npm

# Publishes on a per-package version tag (protocol-v0.12.0, platform-v0.17.4,
# streaming-v0.1.0, transcoding-v0.3.0, …), so a release is a deliberate act rather
# than a side effect of merging, and releasing one workspace package never
# implies another. Failed tag jobs
# can be re-run from Actions without permitting a branch to publish a package.
on:
  push:
    tags: ["protocol-v*", "platform-v*", "streaming-v*", "transcoding-v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for npm provenance: npm exchanges this OIDC token for a signed
  # attestation linking the tarball to this repo, commit, and workflow run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Bun for install/typecheck/test/build — it owns bun.lock, and this repo
      # has no package-lock.json, so `npm ci` would fail. npm is still set up
      # below, purely to run the publish (bun publish does not do provenance).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tag convention is `<package>-v<version>` — one tag namespace per
      # workspace package. Resolve which package this tag refers to and where
      # its directory lives, for every later step that must act on just that
      # package rather than the whole workspace.
      - name: Resolve package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            protocol-v*)
              DIR="packages/protocol"
              VERSION="${TAG#protocol-v}"
              ;;
            platform-v*)
              DIR="packages/platform"
              VERSION="${TAG#platform-v}"
              ;;
            streaming-v*)
              DIR="packages/streaming"
              VERSION="${TAG#streaming-v}"
              ;;
            transcoding-v*)
              DIR="packages/transcoding"
              VERSION="${TAG#transcoding-v}"
              ;;
            *)
              echo "::error::Tag '$TAG' does not match protocol-v*, platform-v*, streaming-v*, or transcoding-v*"
              exit 1
              ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Gate the publish on the same checks that run locally, across the whole
      # workspace. A version cannot be republished once taken, so it is worth
      # failing here.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # `prepack` builds dist/ during `npm publish` anyway, but running it
      # explicitly makes a build failure legible as its own step.
      - name: Build
        run: bun run build

      # Fail early and clearly if the tag does not match the version being
      # published, rather than shipping something mislabelled. This workflow is
      # tag-only, so the check always applies.
      - name: Verify tag matches package version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          TAG="${{ steps.pkg.outputs.version }}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version $TAG does not match ${{ steps.pkg.outputs.dir }}/package.json version $PKG"
            exit 1
          fi
          echo "Publishing ${{ steps.pkg.outputs.dir }} version $PKG"

      # Confirm the tarball actually contains the built output before it goes
      # out — `files` and the build are easy to drift apart. Greps the plain
      # text listing rather than parsing `--json`, whose schema differs across
      # npm majors (this step previously broke on the CI-installed npm@latest
      # while passing locally).
      - name: Verify dist is in the tarball
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          npm pack --dry-run > /tmp/pack.txt 2>&1
          COUNT="$(grep -c 'dist/' /tmp/pack.txt || true)"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::Tarball contains no dist/ files"
            cat /tmp/pack.txt
            exit 1
          fi
          echo "Tarball contains $COUNT dist/ entries"

      # Trusted Publishing: npm exchanges this job's OIDC token for short-lived
      # publish credentials, so there is no NPM_TOKEN to store, leak, or rotate,
      # and no 2FA bypass.
      #
      # --provenance is passed explicitly. OIDC auth alone did NOT produce an
      # attestation (verified on 0.2.1: dist.attestations was absent), so it is
      # not implied by trusted publishing the way the setup docs suggest.
      #
      # Requires a one-time setup on npmjs.com per package: Settings ->
      # Trusted Publisher -> GitHub Actions, naming this repo and the workflow
      # file (publish.yml).
      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --provenance --access public
